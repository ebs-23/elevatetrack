services:

  db:
    image: postgres:17
    container_name: elevatetrack-db
    environment:
      POSTGRES_USER: elevateuser
      POSTGRES_PASSWORD: elevatepass
      POSTGRES_DB: elevatetrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevateuser -d elevatetrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: elevatetrack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: elevatetrack-backend
    environment:
      DATABASE_URL: postgresql+psycopg://elevateuser:elevatepass@db:5432/elevatetrack
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: ./backend
    container_name: elevatetrack-celery
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://elevateuser:elevatepass@db:5432/elevatetrack
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: elevatetrack-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: